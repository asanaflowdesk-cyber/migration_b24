name: 41 | FlowDesk ChatBot Test

on:
  workflow_dispatch:
  push:
    branches:
      - flowdesk-ux-v2
    paths:
      - "processes/flowdesk_chatbot/**"
      - ".github/workflows/41-flowdesk-chatbot-test.yml"

permissions:
  contents: read

jobs:
  test-chatbot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Проверить синтаксис и логику DeskFlow
        shell: cmd
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set "PYTHON_EXE=C:\Users\Alyona.Sachyova\AppData\Local\Programs\Python\Python312\python.exe"
          "%PYTHON_EXE%" -m py_compile processes\flowdesk_chatbot\config.py processes\flowdesk_chatbot\engine.py processes\flowdesk_chatbot\bitrix_worker.py processes\flowdesk_chatbot\storage.py
          "%PYTHON_EXE%" -m unittest -v processes.flowdesk_chatbot.test_engine
