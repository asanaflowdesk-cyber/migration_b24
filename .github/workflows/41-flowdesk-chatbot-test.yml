name: 41 | FlowDesk ChatBot Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "processes/flowdesk_chatbot/**"
      - ".github/workflows/41-flowdesk-chatbot-test.yml"

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-chatbot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Получить код DeskFlow отдельно
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          clean: false
          fetch-depth: 1
          path: _flowdesk_chatbot_test

      - name: Проверить синтаксис и полный набор тестов DeskFlow
        shell: cmd
        env:
          PYTHONPATH: ${{ github.workspace }}\_flowdesk_chatbot_test
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          set "PYTHON_EXE=C:\Users\admpark\.flowdesk-chatbot\venv\Scripts\python.exe"
          if not exist "%PYTHON_EXE%" set "PYTHON_EXE=C:\Users\Alyona.Sachyova\AppData\Local\Programs\Python\Python312\python.exe"
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          cd /d "_flowdesk_chatbot_test"
          "%PYTHON_EXE%" -c "import requests, truststore" >nul 2>&1
          if errorlevel 1 "%PYTHON_EXE%" -m pip install -r processes\flowdesk\requirements.txt
          "%PYTHON_EXE%" -m py_compile processes\flowdesk_chatbot\config.py processes\flowdesk_chatbot\engine.py processes\flowdesk_chatbot\bitrix_worker.py processes\flowdesk_chatbot\polling.py processes\flowdesk_chatbot\storage.py processes\flowdesk_chatbot\worker_control.py
          "%PYTHON_EXE%" -m unittest discover -v -s processes\flowdesk_chatbot -p "test_*.py"
