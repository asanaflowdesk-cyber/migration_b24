name: 34 | Восстановить переназначение по плану 2026-09-11

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — проверить остаток; apply — исправить только расхождения с сохранённым планом"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirm:
        description: "Для apply введите REPAIR_REASSIGNMENT"
        required: false
        default: ""
        type: string

concurrency:
  group: excluded-user-reassignment
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
        working-directory: processes/excluded_user_reassignment

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Проверить подтверждение
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'REPAIR_REASSIGNMENT' }}
        run: |
          echo Для repair apply введите REPAIR_REASSIGNMENT
          exit /b 1

      - name: Проверить или восстановить по сохранённому плану
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\processes\eqazyna_leads;${{ github.workspace }}\processes\excluded_user_reassignment
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          BITRIX_VERIFY_SSL: ${{ vars.BITRIX_VERIFY_SSL || 'true' }}
          BITRIX_CA_BUNDLE: ${{ vars.BITRIX_CA_BUNDLE }}
          BITRIX_REQUEST_TIMEOUT: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
          REASSIGN_STABILIZE_SECONDS: ${{ vars.REASSIGN_STABILIZE_SECONDS || '12' }}
          REASSIGN_FINAL_WAIT_SECONDS: ${{ vars.REASSIGN_FINAL_WAIT_SECONDS || '5' }}
          REASSIGN_PROGRESS_EVERY: ${{ vars.REASSIGN_PROGRESS_EVERY || '25' }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          chcp 65001 >nul
          if "%TARGET_BITRIX_WEBHOOK_URL%"=="" (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if exist output_repair rmdir /s /q output_repair
          mkdir output_repair
          if "%RUN_MODE%"=="apply" (
            ".venv\Scripts\python.exe" -u repair_from_plan.py --plan-file repair_plan_20260911.csv --apply --output-dir output_repair
          ) else (
            ".venv\Scripts\python.exe" -u repair_from_plan.py --plan-file repair_plan_20260911.csv --output-dir output_repair
          )
          if errorlevel 1 exit /b 1
          type output_repair\excluded_user_reassignment_repair_summary.json

      - name: Загрузить отчёт repair
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 34-repair-excluded-user-reassignment-${{ github.run_number }}
          path: processes/excluded_user_reassignment/output_repair/
          if-no-files-found: warn
          retention-days: 14
