name: 31A | Автосинхронизация пакета учредителя

on:
  repository_dispatch:
    types: [founder_owner_changed]
  workflow_dispatch:
    inputs:
      contact_id:
        description: "ID контакта-учредителя/руководителя"
        required: true
        type: string
      mode:
        description: "Режим запуска"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirm:
        description: "Для apply введите SYNC_FOUNDER_PACKAGE"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: founder-package-owner-writes
  queue: max
  cancel-in-progress: false

env:
  NODE_USE_SYSTEM_CA: "1"
  NODE_OPTIONS: "--use-system-ca"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHON_EXE: C:\Users\Alyona.Sachyova\AppData\Local\Programs\Python\Python312\python.exe
  SOURCE_CONTACT_ID: ${{ github.event.client_payload.contact_id || inputs.contact_id }}

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
        working-directory: processes/company_owner_sync

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Подготовить постоянное окружение Python
        run: |
          if not exist "%PYTHON_EXE%" (
            echo Python не найден: %PYTHON_EXE%
            exit /b 1
          )
          if not exist "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%\Scripts\python.exe" (
            "%PYTHON_EXE%" -m venv "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%"
            if errorlevel 1 exit /b 1
          )
          "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%\Scripts\python.exe" --version

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%\Scripts\python.exe" -m pip install --disable-pip-version-check -r requirements.txt

      - name: Проверить код
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_owner_sync;${{ github.workspace }}\processes\eqazyna_leads
        run: |
          chcp 65001 >nul
          "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%\Scripts\python.exe" sync_founder_packages.py --help >nul

      - name: Проверить подтверждение ручного apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirm != 'SYNC_FOUNDER_PACKAGE' }}
        run: |
          echo Для применения введите SYNC_FOUNDER_PACKAGE
          exit /b 1

      - name: Синхронизировать пакет учредителя
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_owner_sync;${{ github.workspace }}\processes\eqazyna_leads
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          BITRIX_VERIFY_SSL: ${{ vars.BITRIX_VERIFY_SSL || 'true' }}
          BITRIX_CA_BUNDLE: ${{ vars.BITRIX_CA_BUNDLE }}
          BITRIX_REQUEST_TIMEOUT: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
          APPLY_FLAG: ${{ (github.event_name == 'repository_dispatch' || inputs.mode == 'apply') && '--apply' || '' }}
        run: |
          chcp 65001 >nul
          if "%TARGET_BITRIX_WEBHOOK_URL%"=="" (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if not exist output_event mkdir output_event
          "%GITHUB_WORKSPACE%\..\_venvs\company_owner_sync-%RUNNER_NAME%\Scripts\python.exe" -u sync_founder_packages.py %APPLY_FLAG% --output-dir output_event
          if errorlevel 1 exit /b 1
          type output_event\company_owner_sync_summary.json
          dir output_event

      - name: Загрузить отчет
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 31A-founder-package-${{ env.SOURCE_CONTACT_ID }}-${{ github.run_id }}
          path: processes/company_owner_sync/output_event/
          if-no-files-found: warn
          retention-days: 30
