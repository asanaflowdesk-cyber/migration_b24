name: 32 | Лиды — вернуть мои провальные в Новые

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — только показать; apply — вернуть найденные лиды в Новые"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      days:
        description: "За сколько последних дней искать переходы в Провал"
        required: true
        default: "7"
        type: string
      moved_by_user_id:
        description: "Кто перевёл в Провал: ID пользователя. Пусто = BITRIX_REOPEN_MOVED_BY_ID или пользователь вебхука"
        required: false
        default: ""
        type: string
      failed_status_id:
        description: "ID стадии Провал"
        required: true
        default: "JUNK"
        type: string
      target_status_id:
        description: "ID стадии Новые"
        required: true
        default: "NEW"
        type: string
      confirm:
        description: "Для apply введите REOPEN_FAILED_LEADS"
        required: false
        default: ""
        type: string

concurrency:
  group: reopen-failed-leads
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  reopen-failed-leads:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: processes/lead_reopen

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v5

      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Проверить код
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\lead_reopen;${{ github.workspace }}\processes\eqazyna_leads
        run: |
          chcp 65001 >nul
          ".venv\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" reopen_failed_leads.py --help >nul

      - name: Проверить подтверждение боевого запуска
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'REOPEN_FAILED_LEADS' }}
        run: |
          echo Для изменения лидов введите REOPEN_FAILED_LEADS
          exit /b 1

      - name: Найти или вернуть лиды
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\lead_reopen;${{ github.workspace }}\processes\eqazyna_leads
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          BITRIX_VERIFY_SSL: ${{ vars.BITRIX_VERIFY_SSL || 'true' }}
          BITRIX_CA_BUNDLE: ${{ vars.BITRIX_CA_BUNDLE }}
          BITRIX_REQUEST_TIMEOUT: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
          BITRIX_REOPEN_MOVED_BY_ID: ${{ inputs.moved_by_user_id || vars.BITRIX_REOPEN_MOVED_BY_ID }}
        run: |
          chcp 65001 >nul
          if "%TARGET_BITRIX_WEBHOOK_URL%"=="" (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if not exist output mkdir output
          if "${{ inputs.mode }}"=="apply" (
            ".venv\Scripts\python.exe" -u reopen_failed_leads.py --apply --days "${{ inputs.days }}" --failed-status-id "${{ inputs.failed_status_id }}" --target-status-id "${{ inputs.target_status_id }}" --output-dir output
          ) else (
            ".venv\Scripts\python.exe" -u reopen_failed_leads.py --days "${{ inputs.days }}" --failed-status-id "${{ inputs.failed_status_id }}" --target-status-id "${{ inputs.target_status_id }}" --output-dir output
          )
          if errorlevel 1 exit /b 1
          type output\reopen_failed_leads_journal.txt
          type output\reopen_failed_leads_summary.json

      - name: Загрузить отчет
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: 32-reopen-failed-leads-${{ github.run_number }}
          path: processes/lead_reopen/output/
          if-no-files-found: warn
          retention-days: 14
