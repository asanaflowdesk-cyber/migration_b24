name: 20 | Пользователи — регистрация из Excel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — проверить файл; apply — создать пользователей и отправить приглашения"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      file_path:
        description: "Путь к Excel внутри процесса регистрации"
        required: true
        default: "input/users_to_invite.xlsx"
        type: string
      confirm:
        description: "Для apply введите REGISTER_USERS"
        required: false
        default: ""
        type: string

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  register-users:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: processes/user_registration

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        run: '".venv\Scripts\python.exe" -m pip install -r requirements.txt'

      - name: Проверить код регистрации
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: '".venv\Scripts\python.exe" -m pytest -q tests'

      - name: Проверить подтверждение
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'REGISTER_USERS' }}
        run: |
          echo Для реальной регистрации введите REGISTER_USERS
          exit /b 1

      - name: Проверить или зарегистрировать пользователей
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FILE_PATH: ${{ inputs.file_path }}
        run: '".venv\Scripts\python.exe" -u run_from_env.py'

      - name: Загрузить отчет
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: 20-user-registration-${{ github.run_number }}
          path: processes/user_registration/output/
          if-no-files-found: warn
          retention-days: 3
