name: 20 | Пользователи — регистрация из Google Sheets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — проверить new_users_add; apply — создать пользователей и записать ID"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirm:
        description: "Для apply введите REGISTER_USERS"
        required: false
        default: ""
        type: string

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  register-users:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
        working-directory: processes/user_registration

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        run: '".venv\Scripts\python.exe" -m pip install -r requirements.txt'

      - name: Проверить подтверждение
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'REGISTER_USERS' }}
        run: |
          echo Для реальной регистрации введите REGISTER_USERS
          exit /b 1

      - name: Проверить или зарегистрировать пользователей
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: "1WuRHHyQm5lHxDlW81m4P0oZJ6X_SDYj1bN-NOx8aM2k"
          GOOGLE_SHEETS_NEW_USERS_TAB: "new_users_add"
          GOOGLE_SHEETS_USER_LIST_TAB: "user_list"
          INPUT_MODE: ${{ inputs.mode }}
        run: '".venv\Scripts\python.exe" -u run_from_env.py'

      - name: Загрузить отчет
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 20-user-registration-${{ github.run_number }}
          path: processes/user_registration/output/
          if-no-files-found: warn
          retention-days: 7
