name: Director two sources CI (temporary)

on:
  push:
    branches: [fix/director-two-sources-only]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
        working-directory: processes/company_director_enrichment
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: call ..\..\scripts\prepare-python.cmd
      - run: ".venv\Scripts\python.exe" -m pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_director_enrichment;${{ github.workspace }}\processes\eqazyna_leads
        run: |
          chcp 65001 >nul
          ".venv\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" enrich_missing_directors_v3.py --help >nul
