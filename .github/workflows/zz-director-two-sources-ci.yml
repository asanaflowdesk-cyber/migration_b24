name: Director two sources CI (temporary)

on:
  push:
    branches:
      - fix/director-two-sources-only

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: processes/company_director_enrichment
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run enrichment tests
        working-directory: processes/company_director_enrichment
        env:
          PYTHONPATH: ${{ github.workspace }}/processes/company_director_enrichment:${{ github.workspace }}/processes/eqazyna_leads
        run: python -m pytest -q tests
      - name: Check CLI
        working-directory: processes/company_director_enrichment
        env:
          PYTHONPATH: ${{ github.workspace }}/processes/company_director_enrichment:${{ github.workspace }}/processes/eqazyna_leads
        run: python enrich_missing_directors_v3.py --help >/dev/null
