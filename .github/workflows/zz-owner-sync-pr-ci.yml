name: Owner sync PR CI (temporary)

on:
  push:
    branches:
      - perf/founder-queue-2min-progress

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: processes/company_owner_sync
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run owner-sync tests
        working-directory: processes/company_owner_sync
        env:
          PYTHONPATH: ${{ github.workspace }}/processes/company_owner_sync:${{ github.workspace }}/processes/eqazyna_leads
        run: python -m pytest -q tests
