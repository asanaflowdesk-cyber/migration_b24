name: Export Bitrix24 to JSON and Excel

on:
  workflow_dispatch:
    inputs:
      include_history:
        description: "Выгружать CRM-дела и комментарии таймлайна (дольше)"
        required: true
        default: true
        type: boolean
      save_raw_api:
        description: "Сохранять дубли сырых REST-ответов (сильно увеличивает размер)"
        required: true
        default: false
        type: boolean

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-tests
        run: python -m pytest -q

      - name: Export Bitrix24
        env:
          PYTHONUNBUFFERED: "1"
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          EXPORT_ACTIVITIES: ${{ inputs.include_history }}
          EXPORT_RELATIONS: "true"
          EXPORT_PRODUCT_ROWS: "true"
          EXPORT_TIMELINE_COMMENTS: ${{ inputs.include_history }}
          EXPORT_SMART_PROCESSES: "true"
          EXPORT_TASK_STAGES: "true"
          SAVE_RAW_API: ${{ inputs.save_raw_api }}
          REQUEST_DELAY_SECONDS: "0.03"
          HTTP_TIMEOUT_SECONDS: "60"
          MAX_RETRIES: "6"
          MAX_PAGES: "20000"
          PROGRESS_EVERY_PAGES: "5"
          OUTPUT_DIR: output
        run: python -u bitrix_export.py

      - name: Show output files
        if: always()
        run: |
          echo "Output tree:"
          find output -maxdepth 4 -type f -printf '%p %k KB\n' 2>/dev/null | sort || true

      - name: Upload dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitrix24-dump-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
