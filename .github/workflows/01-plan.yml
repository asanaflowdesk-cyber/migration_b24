name: 01 - Проверить план миграции

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Build source plan and validate box
        env:
          PYTHONUNBUFFERED: "1"
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
        run: python -u migrate.py plan
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 01-plan-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
