name: 01 - Проверить план миграции

on:
  workflow_dispatch:

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  plan:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Найти Python и создать локальное окружение
        run: call scripts\prepare-python.cmd

      - name: Установить зависимости локально
        run: '".venv\Scripts\python.exe" -m pip install -r requirements.txt'

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: '".venv\Scripts\python.exe" -m pytest -q tests/test_migration.py'

      - name: Build source plan and validate box
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
        run: '".venv\Scripts\python.exe" -u migrate.py plan'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 01-plan-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
