name: 33 | Исключённые пользователи — перенос пакетов

on:
  workflow_dispatch:
    inputs:
      excluded_user_ids:
        description: "Исключённые пользователи"
        required: true
        default: "15,17,19,22,23,39,44"
        type: string
      mode:
        description: "dry_run — только план; apply — выполнить перенос"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      confirm:
        description: "Для apply введите REASSIGN_EXCLUDED_USERS"
        required: false
        default: ""
        type: string

concurrency:
  group: excluded-user-reassignment
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  reassign:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
        working-directory: processes/excluded_user_reassignment

    steps:
      - name: Получить код
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Подготовить Python
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Проверить код
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\processes\eqazyna_leads;${{ github.workspace }}\processes\excluded_user_reassignment
        run: |
          chcp 65001 >nul
          ".venv\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" reassign_excluded_users.py --help >nul
          if errorlevel 1 exit /b 1

      - name: Проверить подтверждение apply
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'REASSIGN_EXCLUDED_USERS' }}
        run: |
          echo Для apply введите REASSIGN_EXCLUDED_USERS
          exit /b 1

      - name: Перенести пакеты
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\processes\eqazyna_leads;${{ github.workspace }}\processes\excluded_user_reassignment
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          EXCLUDED_USER_IDS: ${{ inputs.excluded_user_ids }}
          REASSIGN_TARGET_ROP_IDS: "72,73"
          REASSIGN_PROTECTED_LEAD_IDS: "401"
          REASSIGN_PROGRESS_EVERY: ${{ vars.REASSIGN_PROGRESS_EVERY || '25' }}
          REASSIGN_FINAL_WAIT_SECONDS: ${{ vars.REASSIGN_FINAL_WAIT_SECONDS || '2' }}
          BITRIX_VERIFY_SSL: ${{ vars.BITRIX_VERIFY_SSL || 'true' }}
          BITRIX_CA_BUNDLE: ${{ vars.BITRIX_CA_BUNDLE }}
          BITRIX_REQUEST_TIMEOUT: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          chcp 65001 >nul
          if "%TARGET_BITRIX_WEBHOOK_URL%"=="" (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if exist output rmdir /s /q output
          mkdir output
          if "%RUN_MODE%"=="apply" (
            ".venv\Scripts\python.exe" -u reassign_excluded_users.py --apply --output-dir output
          ) else (
            ".venv\Scripts\python.exe" -u reassign_excluded_users.py --output-dir output
          )
          if errorlevel 1 exit /b 1

      - name: Загрузить отчёт
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: 33-excluded-user-reassignment-${{ github.run_number }}
          path: processes/excluded_user_reassignment/output/excluded_user_reassignment.csv
          if-no-files-found: warn
          retention-days: 14
