name: 42 | FlowDesk Chatbot control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать с DeskFlow worker"
        required: true
        default: "restart"
        type: choice
        options:
          - restart
          - start
          - stop
          - status

permissions:
  contents: read

concurrency:
  group: flowdesk-chatbot-control
  cancel-in-progress: false

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  chatbot-control:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Получить код DeskFlow отдельно
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          clean: false
          fetch-depth: 1
          path: _flowdesk_chatbot_control

      - name: Управлять DeskFlow worker
        shell: cmd
        env:
          PYTHONUNBUFFERED: "1"
          FLOWDESK_SOURCE_ROOT: ${{ github.workspace }}\_flowdesk_chatbot_control
          PYTHONPATH: ${{ github.workspace }}\_flowdesk_chatbot_control
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          FLOWDESK_PROJECT_ID: "2"
          FLOWDESK_BOT_NAME: "DeskFlow Test"
          FLOWDESK_SERVICE_CHAT_AVATAR_URL: "https://bitrix.theeurasia.kz/picture/K2blnYG5Z7Cm0teajIEf"
          FLOWDESK_ACTIVE_POLL_SECONDS: "1.0"
          FLOWDESK_QUIET_POLL_SECONDS: "60.0"
          FLOWDESK_EVENT_RETRY_ATTEMPTS: "3"
          FLOWDESK_EVENT_RETRY_DELAY: "0.75"
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          set "PYTHON_EXE=C:\Users\Alyona.Sachyova\AppData\Local\Programs\Python\Python312\python.exe"
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          "%PYTHON_EXE%" -u "_flowdesk_chatbot_control\processes\flowdesk_chatbot\worker_control.py" "${{ inputs.action }}"
