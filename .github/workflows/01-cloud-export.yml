name: 01 | Облако — выгрузить данные

on:
  workflow_dispatch:
    inputs:
      include_history:
        description: "Выгружать CRM-дела и комментарии таймлайна (дольше)"
        required: true
        default: true
        type: boolean
      save_raw_api:
        description: "Сохранять дубли сырых REST-ответов (сильно увеличивает размер)"
        required: true
        default: false
        type: boolean
      upload_sensitive_snapshot:
        description: "Загрузить полный CRM-снимок как artifact (ПДн/коммерческие данные, хранение 1 день)"
        required: true
        default: false
        type: boolean

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: processes/cloud_export

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Подготовить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: processes/cloud_export/requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить скрипт
        run: python -m pytest -q tests/test_export.py

      - name: Выгрузить облачный Bitrix24
        env:
          PYTHONUNBUFFERED: "1"
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          EXPORT_ACTIVITIES: ${{ inputs.include_history }}
          EXPORT_RELATIONS: "true"
          EXPORT_PRODUCT_ROWS: "true"
          EXPORT_TIMELINE_COMMENTS: ${{ inputs.include_history }}
          EXPORT_SMART_PROCESSES: "true"
          EXPORT_TASK_STAGES: "true"
          SAVE_RAW_API: ${{ inputs.save_raw_api }}
          REQUEST_DELAY_SECONDS: "0.03"
          HTTP_TIMEOUT_SECONDS: "60"
          MAX_RETRIES: "6"
          MAX_PAGES: "20000"
          PROGRESS_EVERY_PAGES: "5"
          OUTPUT_DIR: output
        run: python -u export_bitrix.py

      - name: Показать созданные файлы
        if: always()
        shell: bash
        run: |
          echo "Output tree:"
          find output -maxdepth 4 -type f -printf '%p %k KB\n' 2>/dev/null | sort || true

      - name: Загрузить технический манифест
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: 01-cloud-export-manifest-${{ github.run_number }}
          path: |
            processes/cloud_export/output/**/manifest.json
            processes/cloud_export/output/**/json/export_log.json
          if-no-files-found: warn
          retention-days: 3

      - name: Загрузить полный снимок (содержит ПДн)
        if: ${{ always() && inputs.upload_sensitive_snapshot }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: 01-cloud-export-sensitive-${{ github.run_number }}
          path: processes/cloud_export/output/
          if-no-files-found: warn
          retention-days: 1
