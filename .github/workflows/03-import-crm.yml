name: 03 - Перенести CRM в коробку

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — расчёт без записи; apply — реальный перенос"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      max_items:
        description: "Ограничение на каждый тип сущности для теста. 0 = всё"
        required: true
        default: "0"
        type: string
      allow_user_fallback:
        description: "Разрешить назначить карточки текущему администратору, если ответственный не найден"
        required: true
        default: false
        type: boolean
      confirm:
        description: "Для apply введите IMPORT_TO_BOX"
        required: false
        default: ""
        type: string

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  import:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Найти Python и создать локальное окружение
        run: call scripts\prepare-python.cmd

      - name: Установить зависимости локально
        run: '".venv\Scripts\python.exe" -m pip install -r requirements.txt'

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: '".venv\Scripts\python.exe" -m pytest -q tests/test_migration.py'

      - name: Confirmation guard
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'IMPORT_TO_BOX' }}
        run: |
          echo Для реального переноса введите IMPORT_TO_BOX
          exit /b 1

      - name: Import CRM
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          HTTP_TIMEOUT_SECONDS: "60"
          MAX_RETRIES: "7"
          REQUEST_DELAY_SECONDS: "0.05"
        run: |
          setlocal EnableExtensions EnableDelayedExpansion
          set "ARGS=migrate.py import --max-items ${{ inputs.max_items }}"
          if /I "${{ inputs.mode }}"=="dry_run" set "ARGS=!ARGS! --dry-run"
          if /I "${{ inputs.allow_user_fallback }}"=="true" set "ARGS=!ARGS! --allow-user-fallback"
          ".venv\Scripts\python.exe" -u !ARGS!
          exit /b !ERRORLEVEL!

      - name: Show results
        if: always()
        run: dir output /s

      - name: Upload report and ID maps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 03-import-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
