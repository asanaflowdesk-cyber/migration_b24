name: 03 - Перенести CRM в коробку

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — расчёт без записи; apply — реальный перенос"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      max_items:
        description: "Ограничение на каждый тип сущности для теста. 0 = всё"
        required: true
        default: "0"
        type: string
      allow_user_fallback:
        description: "Разрешить назначить карточки текущему администратору, если ответственный не найден"
        required: true
        default: false
        type: boolean
      confirm:
        description: "Для apply введите IMPORT_TO_BOX"
        required: false
        default: ""
        type: string

jobs:
  import:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Проверить Python
        run: |
          python --version
          python -m pip --version

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_migration.py

      - name: Confirmation guard
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'IMPORT_TO_BOX' }}
        run: throw "Для реального переноса введите IMPORT_TO_BOX"

      - name: Import CRM
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          HTTP_TIMEOUT_SECONDS: "60"
          MAX_RETRIES: "7"
          REQUEST_DELAY_SECONDS: "0.05"
        run: |
          $argsList = @('migrate.py', 'import', '--max-items', '${{ inputs.max_items }}')
          if ('${{ inputs.mode }}' -eq 'dry_run') {
            $argsList += '--dry-run'
          }
          if ('${{ inputs.allow_user_fallback }}' -eq 'true') {
            $argsList += '--allow-user-fallback'
          }
          & python -u @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show results
        if: always()
        run: |
          if (Test-Path output) {
            Get-ChildItem output -Recurse -File |
              Sort-Object FullName |
              ForEach-Object { "{0} {1:N1} KB" -f $_.FullName, ($_.Length / 1KB) }
          }

      - name: Upload report and ID maps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 03-import-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
