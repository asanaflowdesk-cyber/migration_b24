name: 02 - Зарегистрировать нужных пользователей

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — только проверить; apply — отправить приглашения"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      default_department_id:
        description: "ID подразделения коробки для пользователей, чьё подразделение не найдено по названию"
        required: false
        default: ""
        type: string
      confirm:
        description: "Для apply введите INVITE_USERS"
        required: false
        default: ""
        type: string

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  invite:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Проверить Python
        run: |
          python --version
          python -m pip --version

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_migration.py

      - name: Confirmation guard
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'INVITE_USERS' }}
        run: throw "Для реального приглашения введите INVITE_USERS"

      - name: Invite or check users
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
        run: |
          $argsList = @('migrate.py', 'invite-users')
          if ('${{ inputs.mode }}' -eq 'dry_run') {
            $argsList += '--dry-run'
          }
          if ('${{ inputs.default_department_id }}') {
            $argsList += @('--default-department-id', '${{ inputs.default_department_id }}')
          }
          & python -u @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 02-users-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
