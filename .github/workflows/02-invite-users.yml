name: 02 - Зарегистрировать нужных пользователей

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — только проверить; apply — отправить приглашения"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      default_department_id:
        description: "ID подразделения коробки для пользователей, чьё подразделение не найдено по названию"
        required: false
        default: ""
        type: string
      confirm:
        description: "Для apply введите INVITE_USERS"
        required: false
        default: ""
        type: string

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  invite:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Найти Python и создать локальное окружение
        run: call scripts\prepare-python.cmd

      - name: Установить зависимости локально
        run: ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: ".venv\Scripts\python.exe" -m pytest -q tests/test_migration.py

      - name: Confirmation guard
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'INVITE_USERS' }}
        run: |
          echo Для реального приглашения введите INVITE_USERS
          exit /b 1

      - name: Invite or check users
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
        run: |
          setlocal EnableExtensions EnableDelayedExpansion
          set "ARGS=migrate.py invite-users"
          if /I "${{ inputs.mode }}"=="dry_run" set "ARGS=!ARGS! --dry-run"
          if not "${{ inputs.default_department_id }}"=="" set "ARGS=!ARGS! --default-department-id ${{ inputs.default_department_id }}"
          ".venv\Scripts\python.exe" -u !ARGS!
          exit /b !ERRORLEVEL!

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 02-users-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
