name: TEMP | e-Qazyna dedup hotfix tests

on:
  push:
    branches:
      - hotfix/eqazyna-master-dedup-20260923
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r processes/eqazyna_leads/requirements.txt
      - name: Test e-Qazyna
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/processes/eqazyna_leads
        run: python -m pytest -q processes/eqazyna_leads/tests
