name: 12 | Миграция — перенести данные в коробку

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — полная проверка без записи; apply — реальный перенос"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      max_items:
        description: "Ограничение каждого основного типа для пробного запуска. 0 = всё"
        required: true
        default: "0"
        type: string
      confirm:
        description: "Для apply введите IMPORT_FULL_CLOUD_DUMP"
        required: false
        default: ""
        type: string

concurrency:
  group: 12-migration-import-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"

jobs:
  import:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    defaults:
      run:
        shell: cmd
        working-directory: processes/cloud_to_box

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        run: '".venv\Scripts\python.exe" -m pip install -r requirements.txt'

      - name: Проверить миграционный код
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: '".venv\Scripts\python.exe" -m pytest -q tests/test_migration.py'

      - name: Проверить подтверждение реального переноса
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'IMPORT_FULL_CLOUD_DUMP' }}
        run: |
          echo Для реального переноса введите IMPORT_FULL_CLOUD_DUMP
          exit /b 1

      - name: Проверить или выполнить полный перенос
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          SOURCE_BITRIX_WEBHOOK_URL: ${{ secrets.SOURCE_BITRIX_WEBHOOK_URL }}
          HTTP_TIMEOUT_SECONDS: "90"
          MAX_RETRIES: "7"
          REQUEST_DELAY_SECONDS: "0.05"
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items }}
        run: '".venv\Scripts\python.exe" -u run_from_env.py'

      - name: Показать сформированные отчеты
        if: always()
        run: |
          if exist output (
            dir output /s
          ) else (
            echo Папка output не создана: предыдущий шаг завершился до запуска миграции.
          )
          exit /b 0

      - name: Загрузить отчет и карты ID
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: 12-migration-import-${{ github.run_number }}
          path: processes/cloud_to_box/output/
          if-no-files-found: warn
          retention-days: 3
