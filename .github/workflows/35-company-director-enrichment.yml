name: 35 | Обогащение компаний без руководителя

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — создать утверждаемый план; apply — выполнить ранее созданный plan_id"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      max_companies:
        description: "Только dry_run: сколько компаний проверить; 0 = все"
        required: true
        default: "0"
        type: string
      plan_run_id:
        description: "Только apply: GitHub Run ID утвержденного dry_run"
        required: false
        default: ""
        type: string
      plan_id:
        description: "Только apply: PLAN_ID из утвержденного dry_run"
        required: false
        default: ""
        type: string
      confirm:
        description: "Только apply: введите APPLY_DIRECTOR_PLAN"
        required: false
        default: ""
        type: string

concurrency:
  group: company-director-enrichment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  enrich-missing-directors:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
        working-directory: processes/company_director_enrichment

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Проверить код
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_director_enrichment;${{ github.workspace }}\processes\eqazyna_leads
        run: |
          chcp 65001 >nul
          ".venv\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" -m py_compile director_frozen_plan.py enrich_missing_directors_v4.py
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" enrich_missing_directors_v4.py --help >nul

      - name: Проверить параметры apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if not "${{ inputs.confirm }}"=="APPLY_DIRECTOR_PLAN" (
            echo Для apply введите APPLY_DIRECTOR_PLAN
            exit /b 1
          )
          if "${{ inputs.plan_run_id }}"=="" (
            echo Не задан plan_run_id из утвержденного dry_run
            exit /b 1
          )
          if "${{ inputs.plan_id }}"=="" (
            echo Не задан plan_id из утвержденного dry_run
            exit /b 1
          )

      - name: Скачать утвержденный план из dry_run
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: 35-company-director-enrichment-*
          merge-multiple: true
          path: processes/company_director_enrichment/approved_plan

      - name: Выполнить dry_run или утвержденный план
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_director_enrichment;${{ github.workspace }}\processes\eqazyna_leads
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          BITRIX_VERIFY_SSL: ${{ vars.BITRIX_VERIFY_SSL || 'true' }}
          BITRIX_CA_BUNDLE: ${{ vars.BITRIX_CA_BUNDLE }}
          BITRIX_REQUEST_TIMEOUT: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
          DIRECTOR_ENRICH_WORKERS: ${{ vars.DIRECTOR_ENRICH_WORKERS || '6' }}
          DIRECTOR_HTTP_TIMEOUT: ${{ vars.DIRECTOR_HTTP_TIMEOUT || '12' }}
        run: |
          chcp 65001 >nul
          if "%TARGET_BITRIX_WEBHOOK_URL%"=="" (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if exist output rmdir /s /q output
          mkdir output
          if "${{ inputs.mode }}"=="apply" (
            if not exist approved_plan\company_director_plan.json (
              echo В артефакте dry_run нет company_director_plan.json
              exit /b 1
            )
            ".venv\Scripts\python.exe" -u enrich_missing_directors_v4.py ^
              --apply-plan approved_plan\company_director_plan.json ^
              --expected-plan-id "${{ inputs.plan_id }}" ^
              --current-sha "${{ github.sha }}" ^
              --output-dir output
          ) else (
            ".venv\Scripts\python.exe" -u enrich_missing_directors_v4.py ^
              --max-companies "${{ inputs.max_companies }}" ^
              --output-dir output
          )
          set EXITCODE=%ERRORLEVEL%
          if exist output\PLAN_ID.txt type output\PLAN_ID.txt
          if exist output\company_director_enrichment_summary.json type output\company_director_enrichment_summary.json
          dir output
          exit /b %EXITCODE%

      - name: Загрузить отчет и неизменяемый план
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 35-company-director-enrichment-${{ github.run_number }}
          path: processes/company_director_enrichment/output/
          if-no-files-found: warn
          retention-days: 30
