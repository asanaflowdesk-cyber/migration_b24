name: 31 | Синхронизация ответственных — руководитель → компании и лиды

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run — только отчет; apply — выровнять компании и лиды по текущему ответственному контакта руководителя"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirm:
        description: "Для apply введите SYNC_TO_DIRECTOR_OWNER"
        required: false
        default: ""
        type: string

concurrency:
  group: founder-package-owner-writes
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  reconcile-company-lead-owners:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
        working-directory: processes/company_owner_sync

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Проверить код
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_owner_sync;${{ github.workspace }}\processes\eqazyna_leads
        run: |
          chcp 65001 >nul
          ".venv\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" reconcile_company_lead_owners.py --help >nul

      - name: Проверить подтверждение боевого запуска
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'SYNC_TO_DIRECTOR_OWNER' }}
        run: |
          echo Для записи в коробку введите SYNC_TO_DIRECTOR_OWNER
          exit /b 1

      - name: Выровнять компании и лиды по контакту руководителя
        env:
          PYTHONPATH: ${{ github.workspace }}\processes\company_owner_sync;${{ github.workspace }}\processes\eqazyna_leads
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          BITRIX_VERIFY_SSL: ${{ vars.BITRIX_VERIFY_SSL || 'true' }}
          BITRIX_CA_BUNDLE: ${{ vars.BITRIX_CA_BUNDLE }}
          BITRIX_REQUEST_TIMEOUT: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
          OWNER_SYNC_WORKERS: ${{ vars.OWNER_SYNC_WORKERS || '8' }}
        run: |
          chcp 65001 >nul
          if "%TARGET_BITRIX_WEBHOOK_URL%"=="" (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if not exist output mkdir output
          if "${{ inputs.mode }}"=="apply" (
            ".venv\Scripts\python.exe" -u reconcile_company_lead_owners.py --apply --output-dir output
          ) else (
            ".venv\Scripts\python.exe" -u reconcile_company_lead_owners.py --output-dir output
          )
          if errorlevel 1 exit /b 1
          type output\company_owner_sync_summary.json
          dir output

      - name: Загрузить отчет
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 31-company-lead-owner-reconcile-${{ github.run_number }}
          path: processes/company_owner_sync/output/
          if-no-files-found: warn
          retention-days: 7
