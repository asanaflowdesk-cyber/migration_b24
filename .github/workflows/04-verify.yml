name: 04 - Сверить результат миграции

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify migration markers and counts
        env:
          PYTHONUNBUFFERED: "1"
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
        run: python -u migrate.py verify
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 04-verify-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
