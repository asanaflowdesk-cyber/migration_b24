name: 04 - Сверить результат миграции

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Проверить Python
        run: |
          python --version
          python -m pip --version

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_migration.py

      - name: Verify migration markers and counts
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
        run: python -u migrate.py verify

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 04-verify-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
