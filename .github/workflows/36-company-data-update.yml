name: 36 | Компании — обновление данных из Google Sheets

on:
  workflow_dispatch:
    inputs:
      spreadsheet:
        description: "ID или полная ссылка Google Sheets"
        required: true
        default: "1WuRHHyQm5lHxDlW81m4P0oZJ6X_SDYj1bN-NOx8aM2k"
        type: string
      sheet:
        description: "Имя листа"
        required: true
        default: "update_contact"
        type: string
      mode:
        description: "dry_run — проверить; apply — обновить Bitrix24"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirm:
        description: "Только apply: введите APPLY_COMPANY_UPDATES"
        required: false
        default: ""
        type: string

concurrency:
  group: company-data-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_USE_SYSTEM_CA: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  update-companies:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
        working-directory: processes/company_data_update

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Найти Python и создать локальное окружение
        run: call ..\..\scripts\prepare-python.cmd

      - name: Установить зависимости
        env:
          CUSTOM_PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          if not "%CUSTOM_PIP_INDEX_URL%"=="" set "PIP_INDEX_URL=%CUSTOM_PIP_INDEX_URL%"
          ".venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Проверить код
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\processes\company_data_update
        run: |
          chcp 65001 >nul
          ".venv\Scripts\python.exe" -m pytest -q tests
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" -m py_compile company_data_update.py google_sheets.py
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" company_data_update.py --help >nul

      - name: Проверить подтверждение apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if not "${{ inputs.confirm }}"=="APPLY_COMPANY_UPDATES" (
            echo Для apply введите APPLY_COMPANY_UPDATES
            exit /b 1
          )

      - name: Выполнить поток 36
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\processes\company_data_update
          TARGET_BITRIX_WEBHOOK_URL: ${{ secrets.TARGET_BITRIX_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HTTP_TIMEOUT_SECONDS: ${{ vars.BITRIX_REQUEST_TIMEOUT || '45' }}
        run: |
          chcp 65001 >nul
          if not defined TARGET_BITRIX_WEBHOOK_URL (
            echo Не задан secret TARGET_BITRIX_WEBHOOK_URL
            exit /b 1
          )
          if not defined GOOGLE_SERVICE_ACCOUNT_JSON (
            echo Не задан secret GOOGLE_SERVICE_ACCOUNT_JSON
            exit /b 1
          )
          if exist output rmdir /s /q output
          mkdir output
          ".venv\Scripts\python.exe" -u company_data_update.py --spreadsheet "${{ inputs.spreadsheet }}" --sheet "${{ inputs.sheet }}" --mode "${{ inputs.mode }}"
          set EXITCODE=%ERRORLEVEL%
          if exist output\summary.json type output\summary.json
          exit /b %EXITCODE%

      - name: Загрузить отчет
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 36-company-data-update-${{ github.run_number }}
          path: processes/company_data_update/output/
          if-no-files-found: warn
          retention-days: 30
